<!-- SVNIT Logo - Sardar Vallabhbhai National Institute of Technology -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="svnitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c1e0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#svnitGrad)"/>
  <!-- Gear/wheel motif -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="50" cy="50" r="10" fill="white"/>
  <!-- Spokes -->
  <line x1="50" y1="22" x2="50" y2="38" stroke="white" stroke-width="3"/>
  <line x1="50" y1="62" x2="50" y2="78" stroke="white" stroke-width="3"/>
  <line x1="22" y1="50" x2="38" y2="50" stroke="white" stroke-width="3"/>
  <line x1="62" y1="50" x2="78" y2="50" stroke="white" stroke-width="3"/>
  <line x1="30" y1="30" x2="41" y2="41" stroke="white" stroke-width="2.5"/>
  <line x1="59" y1="59" x2="70" y2="70" stroke="white" stroke-width="2.5"/>
  <line x1="70" y1="30" x2="59" y2="41" stroke="white" stroke-width="2.5"/>
  <line x1="41" y1="59" x2="30" y2="70" stroke="white" stroke-width="2.5"/>
  <!-- NIT text -->
  <text x="50" y="94" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" fill="white" text-anchor="middle">SVNIT</text>
</svg>
