<!-- ACM Logo - Association for Computing Machinery -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="acmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a35de;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5f90ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#acmGrad)"/>
  <!-- ACM diamond shape -->
  <path d="M50 15 L80 50 L50 85 L20 50 Z" fill="none" stroke="white" stroke-width="4"/>
  <!-- ACM letters -->
  <text x="50" y="57" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" fill="white" text-anchor="middle">ACM</text>
</svg>
